<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla BS</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <script src="bootstrap.bundle.min.js"></script>
    <style>
        /* Clases ejemplo BS: 
        - img-fluid -> Imagen responsive 
        - rounded -> Bordes redondeados 
        - carousel -> Pase diapositivas
            - slide -> Efecto de pase
            - w-50 -> Ancho 50%
            - carousel-indicators -> Controles inferiores
            - carousel-inner -> Pie del slider
                - carousel-item -> Elemento de pie
                - carousel-caption -> Texto elemento
                - active -> Elemento activo
                - d-block -> Display bloque
                - d-none -> Display none
            - carousel-control-prev
            - carousel-control-prev-icon
            - carousel-control-next
            - carousel-control-next-icon
            - visually-hidden -> Visibility hidden
        */
    </style>
</head>

<body>
    <header class="container text-center bg-info border p-3 m-3">
        <figure>
            <img src="img/jean-michel-jarre-sevilla1.webp" alt="JMJ" class="rounded img-fluid">
        </figure>
        <figure>
            <img src="img/jean-michel-jarre-sevilla1.webp" alt="JMJ" class="img-thumbnail w-25">
        </figure>
    </header>

    <main id="jmj-sevilla" class="carousel slide w-50">
        <section class="carousel-indicators" aria-label="indicadores">
            <button type="button" data-bs-target="#jmj-sevilla" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1">🎛️</button>
            <button type="button" data-bs-target="#jmj-sevilla" data-bs-slide-to="1"
                aria-label="Slide 2">🎛️</button>
            <button type="button" data-bs-target="#jmj-sevilla" data-bs-slide-to="2"
                aria-label="Slide 3">🎛️</button>
        </section>
        <section class="carousel-inner" aria-label="diapositivas">
            <figure class="carousel-item active">
                <img src="img/jean-michel-jarre-sevilla1.webp" class="d-block w-100" alt="...">
                <figcaption class="carousel-caption d-none d-md-block">
                    <h5>First slide label</h5>
                    <p>Some representative placeholder content for the first slide.</p>
                </figcaption>
            </figure>
            <figure class="carousel-item">
                <img src="img/jean-michel-jarre-sevilla2.webp" class="d-block w-100" alt="...">
                <figcaption class="carousel-caption d-none d-md-block">
                    <h5>Second slide label</h5>
                    <p>Some representative placeholder content for the second slide.</p>
                </figcaption>
            </figure>
            <figure class="carousel-item">
                <img src="img/jean-michel-jarre-sevilla3.webp" class="d-block w-100" alt="...">
                <figcaption class="carousel-caption d-none d-md-block">
                    <h5>Third slide label</h5>
                    <p>Some representative placeholder content for the third slide.</p>
                </figcaption>
            </figure>
        </section>

        <button class="carousel-control-prev" type="button" data-bs-target="#jmj-sevilla"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"
            style="font-size: 50px;">⬅️</span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#jmj-sevilla"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"
            style="font-size: 50px;">➡️</span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </main>
</body>

</html>
