<!-- ejemplo_00_plantilla.html -->
 <!DOCTYPE html>
 <html lang="es">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla BS</title>
    <!-- Carga de BootStrap (BS) y FontAwesome (FA) en local  -->
    <link rel="stylesheet" href="bootstrap.min.css">
    <script src="bootstrap.bundle.min.js"></script>

    <!-- Carga de los iconos de BS FA -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Clases usadas de BS: 
        - container -> Contenedor
        - text-center -> Elementos centrados
        - bg-secondary -> Fondo gris
        - border -> Borde
        - border-black -> Borde negro 
        - border-3 -> Grosor Borde [0..6] 
        - p-3 -> Relleno 3 [0..6] 
        - m-3 -> Margen 3 [0..6] */
        
    </style>
 </head>
 <body>
    <main class="container text-center bg-secondary border border-danger border-3 p-3 m-3">
        <p>Párrafo 1</p>
        <p>Párrafo 2</p>
        <p>Párrafo 3</p>
        <p>Párrafo 4</p>
    </main>
 </body>
 </html>
